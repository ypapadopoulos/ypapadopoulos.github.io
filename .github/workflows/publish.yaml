name: Deploy website to Custom Domain

env:
  HUGO_VERSION: "0.146.4"
  PYTHON_VERSION: "3.12"

on:
  # Trigger the workflow every time you push to the `main` branch
  push:
    branches: ["main"]
  # Allows you to run this workflow manually from the Actions tab on GitHub.
  workflow_dispatch:

# Provide permission to clone the repo and deploy it to GitHub Pages
permissions:
  contents: read

concurrency:
  group: "website-deployment"
  cancel-in-progress: false

jobs:
  # Build website
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Fetch history for Hugo's .GitInfo and .Lastmod
          fetch-depth: 0
          lfs: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install database exporter dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install openpyxl pyyaml
      - name: Export website databases
        run: |
          python scripts/export_database.py all
      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: ${{ env.HUGO_VERSION }}
          extended: true
      - name: Build website
        env:
          HUGO_ENVIRONMENT: production
        run: |
          echo "Hugo version:"
          hugo version
          echo "Hugo cache directory:"
          hugo config | grep cachedir || true
          rm -rf public/ resources/_gen/
          hugo \
            --cleanDestinationDir \
            --minify

      - name: Install lftp
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp

      - name: Deploy via FTP
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          lftp -e "
          open -u $FTP_USER,$FTP_PASSWORD $FTP_HOST
          set ftp:ssl-allow no
          mirror -R ./public/ ./ --delete --parallel=5
          bye
          "